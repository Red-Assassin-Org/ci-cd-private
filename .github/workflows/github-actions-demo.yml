name: semgrep-sast-scan
on:
  pull_request:
    branches: main
  push:
    branches: main
  
jobs:
  semgrep-full-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repo
        uses: actions/checkout@v2

      - name: fetch-semgrep-custom-scripts
        uses: actions/checkout@v2
        with:
          repository: test/test
          path: automation-scripts

      - name: Setup Semgrep
        run: bash -i custom-scripts/setup-semgrep.sh

      - name: Complete Scan
        run: bash -i custom-scripts/run-semgrep.sh automation-scripts/semgrep-rules/
        
      
