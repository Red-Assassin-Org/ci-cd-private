name: semgrep-sast-scan
on:
  pull_request:
    branches: main
  push:
    branches: main
  
jobs:
  smegrep-full-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repo
        uses: actions/checkout@v2

      - name: fetch-semgrep-custom-scripts
        uses: actions/checkout@v2
        with:
          repository: test/test
          path: custom-scripts 
        
      
