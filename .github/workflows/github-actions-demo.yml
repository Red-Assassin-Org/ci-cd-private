name: semgrep-sast-scan
on:
  pull_request:
    branches: main
  push:
    branches: main
  
jobs:
  semgrep-full-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repo
        uses: actions/checkout@v2

      - name: fetch-semgrep-custom-scripts
        uses: actions/checkout@v2
        with:
          repository: red-assassin/automation-scripts
          path: automation-scripts

      - name: list directory structure
        run: "ls -la"

      - name: Setup Semgrep
        run: |
          bash -i automation-scripts/scripts/setup-semgrep.sh

      - name: Run built-in semgrep rules
        uses: ankitjain28may/list-files-in-pr@v1.0
        with:
          githubToken: ${{ github.token }}
          outputFormat: 'space-delimited'
      - run: | 
          if [ GITHUB_EVENT_NAME == "pull_request" ]; then
            for file in ${{ steps.list-files.outputs.pullRequestFiles }}; do
              echo $file;
            done
          else
            echo "Pull request not found"
          fi
        
            
      
