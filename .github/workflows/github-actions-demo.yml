name: learn-github-actions
run-name: ${{ github.actor }} is learning GitHub Actions
on:
  workflow_dispatch:
    inputs:
      bats_version:
        description: bats version to install
        required: true
jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '14'
        env:
          super_secret: ${{ secrets.TOKEN_POC }}
      - run: npm install -g bats@${{ github.event.inputs.bats_version }}
      - run: bats -v
